<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bouncy Bass Sequencer</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#f1f2f5;background:#11151d}body{margin:0;padding:20px;max-width:900px;margin:auto}h1{font-size:24px;margin:0 0 6px}.sub{color:#aeb6c5;font-size:13px;margin-bottom:18px}.panel{background:#1b2230;border:1px solid #303b4e;border-radius:14px;padding:15px;margin:12px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit}button{border:0;border-radius:9px;background:#334257;color:white;padding:11px 14px;cursor:pointer}button.primary{background:#17a58b;color:#061d18;font-weight:700}button:active{transform:scale(.98)}label{font-size:13px;color:#ccd4df}input[type=range]{width:130px;vertical-align:middle}.gridwrap{overflow-x:auto;padding-bottom:8px}.grid{display:grid;grid-template-columns:58px repeat(16,minmax(33px,1fr));gap:4px;min-width:640px}.cell{height:32px;border-radius:5px;background:#293345;border:1px solid #354259;padding:0;min-width:0}.cell.beat{border-left:2px solid #718198}.cell.on{background:#2bc7a4;border-color:#62e8cb}.cell.playing{outline:2px solid #ffd166;outline-offset:1px}.head{font-size:11px;text-align:center;color:#c0c9d8;padding:7px 0}.note{font-size:12px;text-align:right;padding:8px 5px;color:#cbd6e4}.muted{color:#aeb6c5;font-size:12px;line-height:1.6}.steps{display:grid;grid-template-columns:repeat(16,minmax(33px,1fr));gap:4px;min-width:560px;margin-left:62px}.stepbtn{font-size:11px;padding:6px 0;background:#293345}.stepbtn.active{background:#a16ed6}.scroll{overflow-x:auto}select{background:#293345;color:white;border:1px solid #53617a;border-radius:7px;padding:8px}strong{color:#7de5cb}</style></head><body><h1>跳ねるベース・シーケンサー</h1><div class="sub">3ピースの新曲用・16ステップ（8分音符 × 2小節） / iPhone Safari対応</div><div class="panel controls"><button class="primary" id="play">▶ 再生</button><button id="stop">■ 停止</button><label>BPM <b id="bpmText">160</b> <input id="bpm" type="range" min="90" max="210" value="160"></label><label>音の長さ <b id="gateText">55%</b> <input id="gate" type="range" min="20" max="100" value="55"></label><label>音色 <select id="wave"><option value="sawtooth">エレキベース風</option><option value="sine">丸い音</option><option value="square">太い音</option></select></label></div><div class="panel"><div class="controls"><button id="preset1">跳躍モータウン風</button><button id="preset2">裏拍アクセント</button><button id="clear">クリア</button></div><p class="muted">マスをタップして音を配置。同じ列の別の音を選ぶと置き換え。紫のボタンで休符にできる。縦軸は音高、横軸は8分音符。</p><div class="gridwrap"><div class="grid" id="grid"></div></div><div class="scroll"><div class="steps" id="rests"></div></div></div><div class="panel"><div class="controls"><label>キー <select id="key"><option value="0">C</option><option value="2">D</option><option value="4">E</option><option value="5">F</option><option value="7">G</option><option value="9">A</option><option value="10">Bb</option></select></label><button id="copy">パターンをコピー</button></div><p class="muted">音はWeb Audio APIで合成。最初に「再生」をタップするとiPhoneでも鳴る。スピーカーでは低音が弱いため、イヤホン推奨。ドラムやコードは次の段階で追加できる。</p></div><script>
(()=>{'use strict';const notes=[['C3',60],['Bb2',58],['A2',57],['G2',55],['F2',53],['E2',52],['D2',50],['C2',48],['Bb1',46],['A1',45],['G1',43]];let pattern=Array(16).fill(null),playing=false,ctx=null,timer=null,step=0,nextTime=0,activeNodes=[];const $=id=>document.getElementById(id);const grid=$('grid'),rests=$('rests');function draw(){grid.innerHTML='';let corner=document.createElement('div');grid.appendChild(corner);for(let s=0;s<16;s++){let d=document.createElement('div');d.className='head';d.textContent=(Math.floor(s/2)%4+1)+(s%2?'&':'');grid.appendChild(d)}notes.forEach(([name,midi])=>{let label=document.createElement('div');label.className='note';label.textContent=name;grid.appendChild(label);for(let s=0;s<16;s++){let b=document.createElement('button');b.className='cell'+(s%2===0?' beat':'')+(pattern[s]===midi?' on':'');b.dataset.step=s;b.setAttribute('aria-label',`${s+1}番目 ${name}`);b.onclick=()=>{pattern[s]=pattern[s]===midi?null:midi;draw()};grid.appendChild(b)}});rests.innerHTML='';for(let s=0;s<16;s++){let b=document.createElement('button');b.className='stepbtn'+(pattern[s]===null?' active':'');b.textContent='休';b.onclick=()=>{pattern[s]=null;draw()};rests.appendChild(b)}}function preset(which){pattern=(which===1?[48,55,60,null,55,52,55,58,48,55,57,55,52,55,50,47]:[48,null,55,60,null,55,52,55,48,55,null,57,55,52,55,null]);draw()}function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function playNote(midi,time,dur){if(midi===null)return;const osc=ctx.createOscillator(),sub=ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain(),subGain=ctx.createGain();const f=440*Math.pow(2,(midi+Number($('key').value)-69)/12);osc.type=$('wave').value;osc.frequency.setValueAtTime(f,time);sub.type='sine';sub.frequency.setValueAtTime(f/2,time);filter.type='lowpass';filter.frequency.setValueAtTime(1000,time);filter.frequency.exponentialRampToValueAtTime(220,time+Math.min(dur,.18));gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(.22,time+.012);gain.gain.exponentialRampToValueAtTime(.0001,time+dur);subGain.gain.value=.08;osc.connect(filter);filter.connect(gain);sub.connect(subGain);subGain.connect(gain);gain.connect(ctx.destination);osc.start(time);sub.start(time);osc.stop(time+dur+.02);sub.stop(time+dur+.02);activeNodes.push(osc,sub)}function tick(){if(!playing)return;const interval=60/Number($('bpm').value)/2;while(nextTime<ctx.currentTime+.12){const s=step;playNote(pattern[s],nextTime,interval*Number($('gate').value)/100);const delay=Math.max(0,(nextTime-ctx.currentTime)*1000);setTimeout(()=>{if(!playing)return;document.querySelectorAll('.cell.playing').forEach(e=>e.classList.remove('playing'));document.querySelectorAll(`.cell[data-step="${s}"]`).forEach(e=>e.classList.add('playing'))},delay);step=(step+1)%16;nextTime+=interval}}$('play').onclick=()=>{audio();if(playing)return;playing=true;step=0;nextTime=ctx.currentTime+.04;tick();timer=setInterval(tick,25);$('play').textContent='♪ 再生中'};$('stop').onclick=()=>{playing=false;clearInterval(timer);activeNodes.forEach(n=>{try{n.stop()}catch(e){}});activeNodes=[];document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));$('play').textContent='▶ 再生'};$('preset1').onclick=()=>preset(1);$('preset2').onclick=()=>preset(2);$('clear').onclick=()=>{pattern.fill(null);draw()};$('bpm').oninput=e=>$('bpmText').textContent=e.target.value;$('gate').oninput=e=>$('gateText').textContent=e.target.value;$('copy').onclick=()=>{const txt=`BPM ${$('bpm').value} / key +${$('key').value} / ${pattern.map(n=>n===null?'休':notes.find(x=>x[1]===n)?.[0]||n).join(' ')}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>alert('コピーしたよ')).catch(()=>prompt('コピーしてね',txt));else prompt('コピーしてね',txt)};preset(1)})();
</script></body></html>
